        </a>


        <a
            class="btn btn-secondary"
            href="index.html#projectsSection"
        >
            ← Voltar à plataforma
        </a>


    </header>



    <div class="detail-container">


        <div id="content">

            <div class="detail-card">
                Carregando informações da construção...
            </div>

        </div>


    </div>

<!-- DADOS E ARMAZENAMENTO -->

<script src="dados/config.js"></script>

<script src="dados/obras.js"></script>

<script src="js/armazenamento.js"></script>



<script>

(() => {

    "use strict";


    const id =
        new URLSearchParams(
            location.search
        ).get("id");


    const root =
        document.getElementById("content");


    const objectURLs = [];


    function safe(value) {

        return String(value ?? "").replace(
            /[&<>"']/g,
            char => ({

                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#39;"

            })[char]
        );

    }


    function dateFormat(value) {

        if (!value) return "Não informado";


        const date =
            new Date(`${value}T12:00:00`);


        if (Number.isNaN(date.getTime())) {
            return "Data inválida";
        }


        return new Intl.DateTimeFormat(
            "pt-BR"
        ).format(date);

    }


    function stateClass(status) {

        if (status === "Concluída") {
            return "concluida";
        }

        if (status === "Em andamento") {
            return "andamento";
        }

        return "planejamento";

    }


    function renderTimeline(work) {

        const schedule =
            Array.isArray(work.cronograma)
                ? work.cronograma
                : [];


        if (!schedule.length) {

            return `

                <div class="empty-gallery">

                    Nenhum cronograma cadastrado.

                </div>

            `;

        }


        return schedule.map(item => {

            const status =
                item.status || "Pendente";


            const className =

                status === "Concluída"
                    ? "done"

                    : status === "Em andamento"
                        ? "current"
                        : "";


            return `

                <div class="detail-timeline-item ${className}">


                    <strong>

                        ${safe(item.titulo)}

                    </strong>


                    <small>

                        PREVISÃO: ${dateFormat(item.data)}

                    </small>


                    <p>

                        ${safe(item.descricao)}

                    </p>


                    <span class="work-status ${stateClass(status)}">

                        ${safe(status)}

                    </span>


                </div>

            `;

        }).join("");

    }


    function renderGallery(photos) {

        if (!photos.length) {

            return `

                <div class="empty-gallery">

                    Nenhuma fotografia foi adicionada a esta construção.

                    <br>

                    Utilize o formulário de edição na plataforma para adicionar imagens.

                </div>

            `;

        }


        return photos.map(photo => {

            const url =
                URL.createObjectURL(photo.blob);


            objectURLs.push(url);


            return `

                <div class="detail-photo">


                    <a

                        href="${url}"

                        target="_blank"

                        rel="noopener"

                        title="Visualizar fotografia"

                    >

                        <img

                            src="${url}"

                            alt="${safe(photo.name)}"

                            loading="lazy"

                        >

                    </a>


                    <button

                        type="button"

                        data-delete-photo="${safe(photo.id)}"

                        title="Excluir fotografia"

                        aria-label="Excluir fotografia"

                    >

                        ×

                    </button>


                </div>

            `;

        }).join("");

    }


    async function render() {

        const work =
            window.NEXUS_STORAGE.getObra(id);


        if (!work) {

            root.innerHTML = `

                <div class="detail-card">

                    <h2>Construção não encontrada</h2>

                    <p>
                        O registro não existe ou foi removido.
                    </p>

                    <a href="index.html">
                        Voltar à plataforma
                    </a>

                </div>

            `;

            return;

        }


        let photos = [];


        try {

            photos =
                await window.NEXUS_STORAGE.getFotos(work.id);

        } catch (error) {

            console.warn(
                "[NEXUS DETAIL] Não foi possível consultar a galeria:",
                error
            );

        }


        const progress = Math.max(

            0,

            Math.min(
                100,
                Number(work.progresso) || 0
            )

        );


        const status =
            work.etapa || "Planejamento";


        const category =
            work.categoria || "Não informada";


        const responsible =
            work.responsavel || "Não informado";


        root.innerHTML = `


            <!-- CABEÇALHO -->


            <section class="detail-header">


                <div class="section-label">
                    FICHA TÉCNICA DO EMPREENDIMENTO
                </div>


                <h1>
                    ${safe(work.nome)}
                </h1>


                <p>

                    ${safe(work.endereco || work.bairro)}

                    ·

                    ${safe(category)}

                </p>



                <div class="header-meta">


                    <div>

                        <span class="detail-status ${stateClass(status)}">

                            ${safe(status)}

                        </span>


                        <div class="detail-code" style="margin-top:9px">

                            IDENTIFICAÇÃO:

                            ${safe(work.codigo || work.id)}

                        </div>

                    </div>



                    <div class="detail-actions">


                        <a

                            class="primary"

                            href="index.html?obra=${encodeURIComponent(work.id)}"

                        >

                            Localizar no mapa 3D

                        </a>



                        <a href="index.html#projectsSection">

                            Voltar ao portfólio

                        </a>


                    </div>


                </div>


            </section>



            <!-- RESUMO -->


            <section class="detail-summary">


                <div class="detail-summary-card">

                    <small>Categoria</small>

                    <strong>
                        ${safe(category)}
                    </strong>

                </div>


                <div class="detail-summary-card">

                    <small>Progresso</small>

                    <strong>
                        ${progress}%
                    </strong>

                </div>


                <div class="detail-summary-card">

                    <small>Fotografias</small>

                    <strong>
                        ${photos.length}
                    </strong>

                </div>


                <div class="detail-summary-card">

                    <small>Bairro</small>

                    <strong style="font-size:14px">

                        ${safe(work.bairro)}

                    </strong>

                </div>


            </section>



            <!-- CONTEÚDO -->


            <section class="detail-grid">


                <!-- INFORMAÇÕES -->


                <article class="detail-card">


                    <h2>
                        Informações da construção
                    </h2>


                    <p>

                        ${safe(
                            work.descricao ||
                            "Nenhuma descrição cadastrada."
                        )}

                    </p>



                    <div class="detail-data-grid">


                        <div class="detail-data-item">

                            <small>Responsável</small>

                            <strong>
                                ${safe(responsible)}
                            </strong>

                        </div>


                        <div class="detail-data-item">

                            <small>Identificador</small>

                            <strong>
                                ${safe(work.id)}
                            </strong>

                        </div>


                        <div class="detail-data-item">

                            <small>Endereço</small>

                            <strong>
                                ${safe(work.endereco)}
                            </strong>

                        </div>


                        <div class="detail-data-item">

                            <small>Localidade</small>

                            <strong>
                                ${safe(work.bairro)}
                            </strong>

                        </div>


                    </div>


                </article>



                <!-- PROGRESSO -->


                <article class="detail-card">


                    <h2>
                        Acompanhamento do projeto
                    </h2>



                    <div class="detail-progress-info">


                        <span>

                            Percentual registrado

                        </span>


                        <strong>

                            ${progress}%

                        </strong>


                    </div>



                    <div class="detail-progress-track">

                        <span style="width:${progress}%"></span>

                    </div>



                    <div class="detail-data-grid">


                        <div class="detail-data-item">

                            <small>Início</small>

                            <strong>
                                ${dateFormat(work.dataInicio)}
                            </strong>

                        </div>


                        <div class="detail-data-item">

                            <small>Execução</small>

                            <strong>
                                ${dateFormat(work.dataExecucao)}
                            </strong>

                        </div>


                        <div class="detail-data-item">

                            <small>Entrega prevista</small>

                            <strong>
                                ${dateFormat(work.dataEntrega)}
                            </strong>

                        </div>


                        <div class="detail-data-item">

                            <small>Última atualização</small>

                            <strong>
                                ${work.atualizadoEm
                                    ? dateFormat(work.atualizadoEm.slice(0,10))
                                    : "Sem registro"
                                }
                            </strong>

                        </div>


                    </div>


                </article>



                <!-- GALERIA -->


                <article class="detail-card full-width">


                    <h2>
                        Galeria de fotografias
                    </h2>


                    <div class="detail-gallery">

                        ${renderGallery(photos)}

                    </div>


                </article>



                <!-- CRONOGRAMA -->


                <article class="detail-card">


                    <h2>
                        Cronograma da construção
                    </h2>


                    <div class="detail-timeline">

                        ${renderTimeline(work)}

                    </div>


                </article>



                <!-- LOCALIZAÇÃO -->


                <article class="detail-card">


                    <h2>
                        Localização geográfica
                    </h2>


                    <div class="detail-data-grid">


                        <div class="detail-data-item">

                            <small>Latitude</small>

                            <strong>
                                ${Number(work.latitude).toFixed(6)}
                            </strong>

                        </div>


                        <div class="detail-data-item">

                            <small>Longitude</small>

                            <strong>
                                ${Number(work.longitude).toFixed(6)}
                            </strong>

                        </div>


                    </div>



                    <p style="margin-top:19px">

                        A localização está associada ao marcador
                        desta construção na plataforma NEXUS.

                    </p>


                    <div class="detail-actions" style="margin-top:16px">


                        <a

                            class="primary"

                            href="index.html?obra=${encodeURIComponent(work.id)}"

                        >

                            Abrir localização 3D

                        </a>


                        <a

                            href="https://www.openstreetmap.org/?mlat=${work.latitude}&mlon=${work.longitude}#map=17/${work.latitude}/${work.longitude}"

                            target="_blank"

                            rel="noopener"

                        >

                            Abrir OpenStreetMap

                        </a>


                    </div>


                </article>


            </section>



            <div class="detail-note">

                Os registros, fotografias, percentuais e cronogramas
                desta demonstração são dados acadêmicos fictícios.
                Não representam informações oficiais de empreendimentos.

            </div>


        `;


        document.title =
            `${work.nome} | NEXUS`;


        // Remover fotografias da galeria.
        root.querySelectorAll(
            "[data-delete-photo]"
        ).forEach(button => {

            button.addEventListener("click", async () => {

                const confirmed =
                    confirm(
                        "Deseja excluir esta fotografia?"
                    );


                if (!confirmed) return;


                try {

                    await window.NEXUS_STORAGE.deleteFoto(
                        button.dataset.deletePhoto
                    );


                    objectURLs.forEach(url => {
                        URL.revokeObjectURL(url);
                    });


                    objectURLs.length = 0;


                    await render();


                } catch (error) {

                    console.error(error);

                    alert(
                        "Não foi possível remover a fotografia."
                    );

                }

            });

        });

    }


    window.addEventListener("beforeunload", () => {

        objectURLs.forEach(url => {

            URL.revokeObjectURL(url);

        });

    });


    render().catch(error => {

        console.error(
            "[NEXUS DETAIL] Erro:",
            error
        );


        root.innerHTML = `

            <div class="detail-card">

                <h2>Não foi possível carregar os detalhes.</h2>

                <p>
                    Atualize a página ou retorne à plataforma.
                </p>

                <a href="index.html">
                    Voltar ao NEXUS
                </a>

            </div>

        `;

    });


})();

</script>
